name: Deploy legal pages

on:
  push:
    branches:
      - app
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify site files
        run: |
          test -f site/index.html
          test -f site/lifepage/index.html
          test -f site/lifepage/privacy.html
          test -f site/lifepage/terms.html
          test -f site/legal.css
          test -f site/favicon.svg
          test -f site/privacy.html
          test -f site/terms.html
          echo "Publishing from $GITHUB_REF ($GITHUB_SHA)"
          find site -maxdepth 2 -type f -print | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
